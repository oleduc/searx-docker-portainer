services:
  download-template:
    build: https://github.com/oleduc/git-config.git
    container_name: download-template
    networks:
      - srx-lan
    command: -c "
        mkdir -p /build/conf.d/certs/ && cd /build/ && rm -rf ./repo/ &&
        git clone ${CONFIG_REPO_URL} repo &&
        ls -la ./repo/ &&
        envsubst '$${STATIC_CACHE_INDEX_SIZE} $${STATIC_SERVER_CACHE_MAX_SIZE} $${STATIC_CACHE_INACTIVE} $${RESULTS_CACHE_INDEX_SIZE} $${RESULTS_SERVER_CACHE_MAX_SIZE} $${RESULTS_CACHE_INACTIVE}' < ./repo/nginx-proxy.conf.template > /build/conf.d/nginx-proxy.conf &&
        envsubst '$${STATIC_CACHE_EXPIRATION} $${STATIC_CLIENT_CACHE_MAX_AGE} $${RESULTS_CACHE_EXPIRATION} $${RESULTS_CLIENT_CACHE_MAX_AGE}' < ./repo/nginx-endpoints.conf.template > /build/conf.d/nginx-endpoints.include &&
        cp /build/certs/* /build/conf.d/certs/ &&
        mkdir -p /build/searxng/ &&
        cp ./repo/limiter.toml /build/searxng/limiter.toml &&
        ls -la /build/conf.d/ && ls -la /build/conf.d/certs/ && ls -la /build/searxng/
      "
    environment:
      - STATIC_CACHE_INDEX_SIZE=${STATIC_CACHE_INDEX_SIZE}
      - STATIC_SERVER_CACHE_MAX_SIZE=${STATIC_SERVER_CACHE_MAX_SIZE}
      - STATIC_CACHE_EXPIRATION=${STATIC_CACHE_EXPIRATION}
      - STATIC_CACHE_INACTIVE=${STATIC_CACHE_INACTIVE}
      - STATIC_CLIENT_CACHE_MAX_AGE=${STATIC_CLIENT_CACHE_MAX_AGE}
      - RESULTS_CACHE_INDEX_SIZE=${RESULTS_CACHE_INDEX_SIZE}
      - RESULTS_SERVER_CACHE_MAX_SIZE=${RESULTS_SERVER_CACHE_MAX_SIZE}
      - RESULTS_CACHE_EXPIRATION=${RESULTS_CACHE_EXPIRATION}
      - RESULTS_CACHE_INACTIVE=${RESULTS_CACHE_INACTIVE}
      - RESULTS_CLIENT_CACHE_MAX_AGE=${RESULTS_CLIENT_CACHE_MAX_AGE}
    volumes:
      - nginx-config:/build/conf.d/:rw
      - searxng-config:/build/searxng/:rw
      - ${SSL_CERT_PATH}:/build/certs/fullchain.crt:ro
      - ${SSL_KEY_PATH}:/build/certs/private.key:ro

  searx-proxy:
    container_name: searx-proxy
    image: nginx:1.27-alpine
    # Drop the image's stock default.conf (it can be copied into the shared
    # conf.d volume and would shadow our server block) before starting nginx.
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /etc/nginx/conf.d/default.conf; exec nginx -g 'daemon off;'"]
    networks:
      - srx-lan
    restart: on-failure
    depends_on:
      download-template:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    ports:
      - ${NGINX_HTTP_PORT:-5080}:80
      - ${NGINX_HTTPS_PORT:-5443}:443
    volumes:
      - nginx-config:/etc/nginx/conf.d:rw

  searxng:
    container_name: searxng
    image: searxng/searxng:latest
    networks:
      - srx-lan
    depends_on:
      download-template:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: always
    volumes:
      - searxng-config:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=https://${SEARXNG_HOSTNAME:-localhost}/
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_LIMITER=${SEARXNG_LIMITER:-true}
      - SEARXNG_IMAGE_PROXY=${SEARXNG_IMAGE_PROXY:-true}
      - SEARXNG_METHOD=${SEARXNG_METHOD:-POST}
      - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

  valkey:
    container_name: valkey
    image: valkey/valkey:8-alpine
    networks:
      - srx-lan
    restart: always
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE
    logging:
      driver: "json-file"
      options:
        max-size: "1m"
        max-file: "1"

networks:
    srx-lan:
      driver: bridge
      driver_opts:
        com.docker.network.bridge.enable_icc: 1
        com.docker.network.bridge.enable_ip_masquerade: 1
        com.docker.network.bridge.host_binding_ipv4: "0.0.0.0"
        com.docker.network.bridge.name: pv-searx3

volumes:
  nginx-config:
  searxng-config:
  searxng-cache:
  valkey-data:
