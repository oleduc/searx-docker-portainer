name: build-validation

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate self-signed certificates
        run: |
          mkdir -p ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ci-certs/private.key -out ci-certs/fullchain.crt \
            -days 2 -subj "/CN=localhost"

      - name: Write CI .env
        run: |
          cat > .env <<EOF
          CONFIG_REPO_URL=https://github.com/${GITHUB_REPOSITORY}.git
          SEARXNG_HOSTNAME=localhost
          SEARXNG_SECRET=ci-secret
          SEARXNG_LIMITER=true
          SEARXNG_IMAGE_PROXY=true
          SEARXNG_METHOD=POST
          NGINX_HTTP_PORT=5080
          NGINX_HTTPS_PORT=5443
          SSL_CERT_PATH=${GITHUB_WORKSPACE}/ci-certs/fullchain.crt
          SSL_KEY_PATH=${GITHUB_WORKSPACE}/ci-certs/private.key
          STATIC_CACHE_INDEX_SIZE=64m
          STATIC_SERVER_CACHE_MAX_SIZE=1024m
          STATIC_CACHE_EXPIRATION=30d
          STATIC_CACHE_INACTIVE=1d
          STATIC_CLIENT_CACHE_MAX_AGE=2592000
          RESULTS_CACHE_INDEX_SIZE=256m
          RESULTS_SERVER_CACHE_MAX_SIZE=5120m
          RESULTS_CACHE_EXPIRATION=10m
          RESULTS_CACHE_INACTIVE=5m
          RESULTS_CLIENT_CACHE_MAX_AGE=600
          EOF

      - name: Validate docker-compose.yml
        run: docker compose config -q

      - name: Validate limiter.toml
        run: |
          python3 -c "import tomllib; tomllib.load(open('limiter.toml','rb'))"
          echo "limiter.toml is valid TOML"

  smoke-test:
    name: Smoke-test the stack
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Generate self-signed certificates
        run: |
          mkdir -p ci-certs
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout ci-certs/private.key -out ci-certs/fullchain.crt \
            -days 2 -subj "/CN=localhost"
          echo "SSL_CERT_PATH=${GITHUB_WORKSPACE}/ci-certs/fullchain.crt" >> "$GITHUB_ENV"
          echo "SSL_KEY_PATH=${GITHUB_WORKSPACE}/ci-certs/private.key" >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose -f .github/ci/docker-compose.ci.yml up -d

      - name: Wait for SearXNG to answer through nginx
        run: |
          ua='Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Accept: text/html" -H "Accept-Language: en-US,en;q=0.9" \
              -H "Accept-Encoding: gzip, deflate" -H "User-Agent: $ua" \
              http://localhost:8080/ || true)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then
              echo "SearXNG homepage is up"; exit 0
            fi
            sleep 5
          done
          echo "SearXNG did not become ready in time"; exit 1

      - name: Verify homepage content and static caching
        run: |
          ua='Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0'
          hdr=(-H "Accept: text/html" -H "Accept-Language: en-US,en;q=0.9" -H "Accept-Encoding: gzip, deflate" -H "User-Agent: $ua")
          title=$(curl -s "${hdr[@]}" http://localhost:8080/ | grep -o '<title>[^<]*</title>' | head -1)
          echo "homepage title: $title"
          echo "$title" | grep -q "SearXNG" || { echo "unexpected homepage"; exit 1; }
          asset=$(curl -s "${hdr[@]}" http://localhost:8080/ | grep -oE '/static/[^"]+' | head -1)
          echo "static asset: $asset"
          curl -s "${hdr[@]}" -o /dev/null "http://localhost:8080$asset"
          cache=$(curl -s "${hdr[@]}" -o /dev/null -w '%header{x-cache-status}' "http://localhost:8080$asset")
          echo "second request X-Cache-Status: $cache"
          [ "$cache" = "HIT" ] || { echo "expected cache HIT"; exit 1; }

      - name: Dump logs on failure
        if: failure()
        run: docker compose -f .github/ci/docker-compose.ci.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f .github/ci/docker-compose.ci.yml down -v
