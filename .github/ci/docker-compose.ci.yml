# CI-only compose used by .github/workflows/build-validation.yml to smoke-test
# the stack. It mirrors the production ../../docker-compose.yml topology (same
# images, volumes and wiring), with two CI-specific differences:
#   * download-template renders the nginx config from the checked-out workspace
#     (mounted at /workspace) with envsubst, instead of git-cloning
#     CONFIG_REPO_URL, so the exact committed templates are exercised.
#   * searxng is bound on 0.0.0.0 so the smoke test runs on any runner,
#     regardless of whether IPv6 is available in the container namespace.
# Keep this file in sync with ../../docker-compose.yml when the topology changes.
services:
  download-template:
    image: nginx:1.27-alpine
    container_name: ci-download-template
    networks:
      - srx-lan
    entrypoint: sh
    command: -c "
        mkdir -p /build/conf.d/certs/ /build/searxng/ &&
        envsubst '$${STATIC_CACHE_INDEX_SIZE} $${STATIC_SERVER_CACHE_MAX_SIZE} $${STATIC_CACHE_INACTIVE} $${RESULTS_CACHE_INDEX_SIZE} $${RESULTS_SERVER_CACHE_MAX_SIZE} $${RESULTS_CACHE_INACTIVE}' < /workspace/nginx-proxy.conf.template > /build/conf.d/nginx-proxy.conf &&
        envsubst '$${STATIC_CACHE_EXPIRATION} $${STATIC_CLIENT_CACHE_MAX_AGE} $${RESULTS_CACHE_EXPIRATION} $${RESULTS_CLIENT_CACHE_MAX_AGE}' < /workspace/nginx-endpoints.conf.template > /build/conf.d/nginx-endpoints.include &&
        cp /build/certs/* /build/conf.d/certs/ &&
        cp /workspace/limiter.toml /build/searxng/limiter.toml &&
        ls -la /build/conf.d/ && ls -la /build/searxng/
      "
    environment:
      - STATIC_CACHE_INDEX_SIZE=64m
      - STATIC_SERVER_CACHE_MAX_SIZE=1024m
      - STATIC_CACHE_INACTIVE=1d
      - STATIC_CACHE_EXPIRATION=30d
      - STATIC_CLIENT_CACHE_MAX_AGE=2592000
      - RESULTS_CACHE_INDEX_SIZE=256m
      - RESULTS_SERVER_CACHE_MAX_SIZE=5120m
      - RESULTS_CACHE_EXPIRATION=10m
      - RESULTS_CACHE_INACTIVE=5m
      - RESULTS_CLIENT_CACHE_MAX_AGE=600
    volumes:
      - nginx-config:/build/conf.d/:rw
      - searxng-config:/build/searxng/:rw
      - ${GITHUB_WORKSPACE:-../..}:/workspace:ro
      - ${SSL_CERT_PATH}:/build/certs/fullchain.crt:ro
      - ${SSL_KEY_PATH}:/build/certs/private.key:ro

  searx-proxy:
    container_name: ci-searx-proxy
    image: nginx:1.27-alpine
    entrypoint: ["/bin/sh", "-c"]
    command: ["rm -f /etc/nginx/conf.d/default.conf; exec nginx -g 'daemon off;'"]
    networks:
      - srx-lan
    restart: on-failure
    depends_on:
      download-template:
        condition: service_completed_successfully
      searxng:
        condition: service_started
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - nginx-config:/etc/nginx/conf.d:rw

  searxng:
    container_name: ci-searxng
    image: searxng/searxng:latest
    networks:
      - srx-lan
    depends_on:
      download-template:
        condition: service_completed_successfully
      valkey:
        condition: service_started
    restart: always
    volumes:
      - searxng-config:/etc/searxng:rw
      - searxng-cache:/var/cache/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080/
      - SEARXNG_SECRET=ci-smoke-test-secret
      - SEARXNG_LIMITER=true
      - SEARXNG_IMAGE_PROXY=true
      - SEARXNG_METHOD=POST
      - SEARXNG_VALKEY_URL=valkey://valkey:6379/0
      - GRANIAN_HOST=0.0.0.0

  valkey:
    container_name: ci-valkey
    image: valkey/valkey:8-alpine
    networks:
      - srx-lan
    restart: always
    command: valkey-server --save 30 1 --loglevel warning
    volumes:
      - valkey-data:/data

networks:
  srx-lan:
    driver: bridge

volumes:
  nginx-config:
  searxng-config:
  searxng-cache:
  valkey-data:
